<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>MedIntel AI - Login</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/auth.css">

</head>

<body>

<div class="auth-container">

    <div class="auth-card">

        <div class="logo-circle">
            🩺
        </div>

        <h1>MedIntel AI</h1>

        <p class="tagline">
            Smarter Health. Brighter Tomorrow.
        </p>

        <h2>Login</h2>

        <form id="loginForm">

            <label for="loginEmail">
                Email
            </label>

            <input
                type="email"
                id="loginEmail"
                placeholder="Enter your email"
                required>


            <label for="loginPassword">
                Password
            </label>

            <input
                type="password"
                id="loginPassword"
                placeholder="Enter your password"
                required>


            <button
                type="submit"
                class="btn">

                Login

            </button>

        </form>


        <p
            id="loginMessage"
            class="message">
        </p>


        <p class="auth-link">

            Don't have an account?

            <a href="register.html">
                Create Account
            </a>

        </p>

    </div>

</div>


<script type="module" src="js/auth.js"></script>

</body>

</html>
